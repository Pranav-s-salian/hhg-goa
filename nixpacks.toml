[phases.setup]
nixPkgs = ["nodejs_22", "python312", "uv"]

[phases.install]
cmds = [
  "cd shared && npm install --legacy-peer-deps",
  "cd backend && cp package.railway.json package.json && npm install --legacy-peer-deps",
  "cd py && uv sync"
]

[phases.build]
cmds = ["cd backend && npm run build || echo 'No build step'"]

[start]
cmd = "cd backend && npm start"
